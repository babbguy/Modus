{{- if and .Values.orchestrator.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "modus.fullname" . }}-orchestrator
  labels:
    {{- include "modus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "modus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.allowedPeers }}
        {{- toYaml .Values.networkPolicy.allowedPeers | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
