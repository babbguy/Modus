{{- if and .Values.orchestrator.enabled .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modus.secretName" . }}
  labels:
    {{- include "modus.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl | quote }}
  master-api-key: {{ required "secrets.masterApiKey is required when secrets.create=true" .Values.secrets.masterApiKey | quote }}
  {{- if eq .Values.orchestrator.config.authMode "jwt" }}
  jwt-secret: {{ required "secrets.jwtSecret is required when secrets.create=true and authMode=jwt" .Values.secrets.jwtSecret | quote }}
  {{- end }}
{{- end }}
