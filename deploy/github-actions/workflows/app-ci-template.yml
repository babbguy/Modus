# .github/workflows/modus-app-ci.yml
#
# Template workflow for application repos instrumented with Modus.
# Copy this to .github/workflows/ in any application repo.
#
# This workflow validates Modus configuration on every PR and push,
# ensures the agent can reach the orchestrator, and verifies env vars are set.
#
# Required repo secrets (set automatically by modus-register.yml):
#   MODUS_API_KEY
#   MODUS_APP_ID
#   MODUS_URL     — set once at org level or manually
#
# Optional (cost-impact PR comment only): MODUS_MASTER_KEY. Reading the dashboard
# summary is an admin call, so it needs the master key; the per-app MODUS_API_KEY
# can only send usage and heartbeats. Skip the secret to skip that job.

name: Modus — Validate Agent Config

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-config:
    name: Validate Modus Config
    runs-on: ubuntu-latest
    # `secrets` cannot be used in `if:` expressions; map them to env first.
    env:
      MODUS_URL: ${{ secrets.MODUS_URL }}
      MODUS_API_KEY: ${{ secrets.MODUS_API_KEY }}
      MODUS_APP_ID: ${{ secrets.MODUS_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets are present
        run: |
          MISSING=()
          [[ -z "${MODUS_API_KEY}" ]] && MISSING+=("MODUS_API_KEY")
          [[ -z "${MODUS_APP_ID}" ]] && MISSING+=("MODUS_APP_ID")
          [[ -z "${MODUS_URL}" ]] && MISSING+=("MODUS_URL")

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::warning::Modus secrets not configured: ${MISSING[*]}"
            echo "Run the register-app workflow to set up this repository."
          else
            echo "All Modus secrets present"
          fi

      - name: Verify orchestrator reachable
        if: env.MODUS_URL != ''
        run: |
          HEALTH=$(curl -sf --max-time 10 "${MODUS_URL}/health" 2>/dev/null | jq -r '.status' || echo "unreachable")

          if [[ "$HEALTH" == "ok" ]]; then
            echo "Orchestrator reachable: $HEALTH"
          else
            echo "::warning::Orchestrator health check returned: $HEALTH"
            echo "This may be a network issue. App will still deploy — agent buffers locally."
          fi

      - name: Validate API key
        if: env.MODUS_URL != '' && env.MODUS_API_KEY != ''
        run: |
          # POST /api/v1/heartbeat authenticates with the app key in X-Modus-APIKey.
          STATUS=$(curl -s --max-time 10 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Modus-APIKey: ${MODUS_API_KEY}" \
            "${MODUS_URL}/api/v1/heartbeat" \
            -d '{"agent_version": "ci-check"}' \
            -w "%{http_code}" -o /dev/null 2>/dev/null || echo "000")

          case $STATUS in
            200|204)
              echo "API key valid — heartbeat accepted (HTTP $STATUS)"
              ;;
            401|403)
              echo "::error::API key invalid or expired. Re-run the register-app workflow."
              exit 1
              ;;
            *)
              echo "::warning::Heartbeat returned HTTP $STATUS — may be a transient issue"
              ;;
          esac

      - name: Check env file template present
        run: |
          if [[ -f ".env.modus.example" ]]; then
            echo "Found .env.modus.example"
          else
            echo "::notice::Consider adding .env.modus.example for local dev setup"
          fi

      - name: Check the Modus SDK is a dependency (Python repos)
        if: hashFiles('requirements*.txt', 'pyproject.toml', 'setup.py') != ''
        run: |
          # The SDK is not on PyPI; applications depend on it from the Modus repository:
          #   modus-agent @ git+https://github.com/babbguy/Modus.git#subdirectory=sdk
          # In application code, `import modus` must be the first import.
          if grep -rqE "modus-agent|Modus\.git" requirements*.txt pyproject.toml setup.py 2>/dev/null; then
            echo "Modus SDK found in Python dependencies"
          else
            echo "::warning::The Modus SDK is not in your Python dependencies. Add: modus-agent @ git+https://github.com/babbguy/Modus.git#subdirectory=sdk"
          fi

      - name: Summary
        run: |
          {
            echo "## Modus Config Validation"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Secrets present | $([[ -n "${MODUS_API_KEY}" ]] && echo '✅' || echo '⚠️ Missing') |"
            echo "| App ID | ${MODUS_APP_ID:-not set} |"
            echo "| Orchestrator URL | ${MODUS_URL:-not set} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # Annotate PRs with cost impact estimate (optional, runs on PRs only)
  # ------------------------------------------------------------------
  cost-impact:
    name: Cost Impact Estimate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      MODUS_URL: ${{ secrets.MODUS_URL }}
      MODUS_APP_ID: ${{ secrets.MODUS_APP_ID }}
      MODUS_MASTER_KEY: ${{ secrets.MODUS_MASTER_KEY }}
    steps:
      - name: Fetch recent cost data for this app
        id: costs
        if: env.MODUS_URL != '' && env.MODUS_MASTER_KEY != ''
        run: |
          # Dashboard data is an admin read: it needs the master key (X-Modus-APIKey).
          SUMMARY=$(curl -sf --max-time 10 \
            -H "X-Modus-APIKey: ${MODUS_MASTER_KEY}" \
            "${MODUS_URL}/api/v1/dashboard/summary?app_id=${MODUS_APP_ID}" \
            2>/dev/null || echo '{}')

          COST_7D=$(echo $SUMMARY | jq -r '.cost_7d // "N/A"')
          COST_30D=$(echo $SUMMARY | jq -r '.cost_30d // "N/A"')
          echo "cost_7d=$COST_7D" >> $GITHUB_OUTPUT
          echo "cost_30d=$COST_30D" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: steps.costs.outcome == 'success'
        uses: actions/github-script@v7
        env:
          DASHBOARD_URL: ${{ secrets.MODUS_URL }}
        with:
          script: |
            const cost7d = '${{ steps.costs.outputs.cost_7d }}';
            const cost30d = '${{ steps.costs.outputs.cost_30d }}';

            const body = [
              '## 💰 Modus — AI Cost Context',
              '',
              '| Period | Cost |',
              '|--------|------|',
              `| Last 7 days | $${cost7d} |`,
              `| Last 30 days | $${cost30d} |`,
              '',
              '*This is the current cost baseline for this application.*',
              '*Monitor for changes after this PR is deployed.*',
              '',
              `[View in Modus Dashboard](${process.env.DASHBOARD_URL})`
            ].join('\n');

            // Update existing comment if present, otherwise create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Modus')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
