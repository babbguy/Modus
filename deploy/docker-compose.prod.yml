# =============================================================================
# Modus — Production Deployment
# =============================================================================
# Compose file for running Modus on your own infrastructure.
#
# Standalone (single app):
#   docker compose -f docker-compose.prod.yml up --build -d   (builds from this checkout)
#
# Org-wide (multi-app with Conductor):
#   docker compose -f docker-compose.prod.yml --profile org-wide up --build -d
#
# Run from the deploy/ directory (install.sh does this for you). To use the
# published images instead, set MODUS_VERSION in .env, run
# `docker compose -f docker-compose.prod.yml pull` and drop --build; see
# docs/verifying-releases.md.
#
# All data stays on YOUR infrastructure. SQLite by default — no external DB needed.
# Fits on a $5/mo VPS (384MB memory limit per container).
#
# Copyright 2026 babbguy
# SPDX-License-Identifier: FSL-1.1-ALv2
# =============================================================================

name: modus

services:

  # ── Orchestrator ─────────────────────────────────────────────────────────
  # Per-application governance: collects from agents, enforces policies,
  # serves the dashboard in standalone mode.
  orchestrator:
    build:
      context: ..
      dockerfile: Dockerfile.orchestrator
    image: ghcr.io/babbguy/modus-orchestrator:${MODUS_VERSION:-latest}
    container_name: modus-orchestrator
    restart: unless-stopped
    ports:
      - "${MODUS_PORT:-8080}:8080"
    env_file: .env
    environment:
      # Defaults to SQLite (zero-config). A Postgres deployment can select
      # its DSN via .env / the host environment without editing this file:
      #   MODUS_DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/modus
      - MODUS_DATABASE_URL=${MODUS_DATABASE_URL:-sqlite+aiosqlite:///data/modus.db}
      - MODUS_PORT=8080
    volumes:
      - modus_data:/app/data
      - ./plugins:/app/plugins:ro
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Conductor (org-wide mode only) ───────────────────────────────────────
  # Org-level aggregation: collects from N Orchestrators, validates
  # completeness, reconciles, serves org-wide dashboard.
  # Activate with: docker compose --profile org-wide up -d
  conductor:
    build:
      context: ..
      dockerfile: Dockerfile.conductor
    image: ghcr.io/babbguy/modus-conductor:${MODUS_VERSION:-latest}
    container_name: modus-conductor
    restart: unless-stopped
    profiles:
      - org-wide
    ports:
      - "${MODUS_CONDUCTOR_PORT:-8090}:8090"
    env_file: .env
    environment:
      # The Conductor reads CONDUCTOR_* variables, not MODUS_*: these map the
      # shared .env onto them. Any other CONDUCTOR_* setting can go in .env.
      # It keeps its own database, separate from the Orchestrator's: SQLite on
      # the conductor_data volume by default; override with
      # MODUS_CONDUCTOR_DATABASE_URL (not MODUS_DATABASE_URL) so a Postgres
      # Orchestrator doesn't collide here.
      - CONDUCTOR_DATABASE_URL=${MODUS_CONDUCTOR_DATABASE_URL:-sqlite+aiosqlite:///data/conductor.db}
      - CONDUCTOR_ENVIRONMENT=${MODUS_ENVIRONMENT:-production}
      - CONDUCTOR_AUTH_MODE=${MODUS_AUTH_MODE:-jwt}
      - CONDUCTOR_JWT_SECRET=${MODUS_JWT_SECRET:-}
      # Bearer secret the Orchestrators push with (their MODUS_CONDUCTOR_SECRET)
      - CONDUCTOR_CONDUCTOR_SECRET=${MODUS_CONDUCTOR_SECRET:-}
    volumes:
      - conductor_data:/app/data
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  modus_data:
    driver: local
  conductor_data:
    driver: local
