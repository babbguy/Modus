[mypy]
ignore_missing_imports = True
plugins = pydantic.mypy
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = True
# Suppress assignment errors from SDK monkey-patching pattern
disable_error_code = method-assign, no-redef

[pydantic-mypy]
init_forbid_extra = False
init_typed = False

[mypy-tests.*]
ignore_errors = True

[mypy-modus.*]
ignore_errors = True

[mypy-sdk.*]
ignore_errors = True
