# =============================================================================
# Modus — Build & Publish Docker Images
# =============================================================================
# Triggers:
#   - Version tags: v* (e.g., v1.2.0)
#   - Manual run (workflow_dispatch); set dry_run to build without pushing
#
# Publishes to GitHub Container Registry (ghcr.io):
#   - ghcr.io/<owner>/modus-orchestrator:latest
#   - ghcr.io/<owner>/modus-orchestrator:<version>
#   - ghcr.io/<owner>/modus-conductor:latest
#   - ghcr.io/<owner>/modus-conductor:<version>
#
# Every pushed image is signed with cosign (keyless: Sigstore with this
# workflow's GitHub OIDC identity) and gets two GitHub artifact attestations,
# SLSA build provenance and an SPDX SBOM, which are also pushed to the
# registry next to the image. docs/verifying-releases.md has the checks.
# =============================================================================

name: Publish Modus Images

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.2.0)'
        required: false
        type: string
      dry_run:
        description: 'Build the images without pushing them'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:

  # ── Test ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r orchestrator/requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── Build & Push ─────────────────────────────────────────────────────────
  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push the images
      id-token: write      # OIDC identity for keyless signing and attestations
      attestations: write  # store the attestations in GitHub
    strategy:
      matrix:
        include:
          - component: orchestrator
            dockerfile: Dockerfile.orchestrator
          - component: conductor
            dockerfile: Dockerfile.conductor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release version matches the source
        # The image reports the version it is built as (MODUS_BUILD_VERSION);
        # it must be the version of the code inside it.
        if: steps.version.outputs.is_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/check_versions.py "$VERSION"

      - name: Generate image tags
        id: tags
        run: |
          # Image names must be lowercase; the owner may not be.
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/modus-${{ matrix.component }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          TAGS="${IMAGE}:${SHORT_SHA}"
          TAGS="${TAGS},${IMAGE}:latest"

          if [[ "${{ steps.version.outputs.is_release }}" == "true" ]]; then
            TAGS="${TAGS},${IMAGE}:${VERSION}"
            if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+ ]]; then
              MINOR="${BASH_REMATCH[0]}"
              TAGS="${TAGS},${IMAGE}:${MINOR}"
            fi
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # A tag push always publishes; a manual run can build without pushing.
          push: ${{ !inputs.dry_run }}
          # Provenance and the SBOM are signed GitHub attestations (below),
          # which `gh attestation verify` checks; BuildKit's own unsigned
          # attestation manifests would duplicate them.
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          # The version /health reports. Non-release builds report the source version.
          build-args: |
            MODUS_BUILD_VERSION=${{ steps.version.outputs.is_release == 'true' && steps.version.outputs.version || '' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          labels: |
            org.opencontainers.image.title=Modus ${{ matrix.component }}
            org.opencontainers.image.description=AI cost governance — ${{ matrix.component }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=FSL-1.1-ALv2

      # ── Sign and attest the pushed image, by digest ─────────────────────
      - name: Install cosign
        if: ${{ !inputs.dry_run }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance (SLSA)
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate the SBOM (SPDX)
        if: ${{ !inputs.dry_run }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # ── Verify Deployment Files ──────────────────────────────────────────────
  verify-deploy:
    name: Verify Deploy Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose file
        # The compose file loads deploy/.env, which install.sh creates from
        # .env.example on a real host; validate against the example.
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.prod.yml config --quiet

      - name: Validate install script syntax
        run: bash -n deploy/install.sh

      - name: Validate upgrade script syntax
        run: bash -n deploy/upgrade.sh

      - name: Validate uninstall script syntax
        run: bash -n deploy/uninstall.sh

      - name: Check .env.example completeness
        run: |
          ENV_FILE="deploy/.env.example"
          for KEY in MODUS_MODE MODUS_DATABASE_URL MODUS_PORT \
                     MODUS_CONDUCTOR_PORT MODUS_MASTER_API_KEY \
                     MODUS_LOG_LEVEL MODUS_VERSION; do
            if ! grep -q "^${KEY}=" "${ENV_FILE}" && ! grep -q "^# ${KEY}=" "${ENV_FILE}"; then
              echo "ERROR: Missing key ${KEY} in .env.example"
              exit 1
            fi
          done
          echo "All required keys present."
