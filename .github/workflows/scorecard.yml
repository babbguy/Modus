# OpenSSF Scorecard: https://github.com/ossf/scorecard-action
# Publishing results (for the badge and api.scorecard.dev) requires this
# workflow to keep its restricted shape: no workflow-level env, defaults or
# write permissions, and only approved actions in the job. Scorecard runs
# only on the default branch (develop).

name: Scorecard

on:
  push:
    branches: [develop]
  schedule:
    - cron: '23 5 * * 1'  # weekly, Monday 05:23 UTC

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload the results to code scanning
      id-token: write         # publish the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
