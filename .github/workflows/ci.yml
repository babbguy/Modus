name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  release-packaging:
    name: Release packaging
    # The checks the tag workflows (release.yml, publish.yml) depend on, run on
    # every change so a broken release is caught before a tag is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: CHANGELOG has notes for the packaged version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('sdk/pyproject.toml','rb'))['project']['version'])")
          python scripts/release_notes.py "$VERSION" --images > /dev/null
      - name: Orchestrator and Conductor report the packaged version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('sdk/pyproject.toml','rb'))['project']['version'])")
          python scripts/check_versions.py "$VERSION"
      - name: Production compose file is valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.prod.yml config --quiet
      - name: Deploy scripts parse
        run: bash -n deploy/install.sh && bash -n deploy/upgrade.sh && bash -n deploy/uninstall.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - name: Ruff check (must pass with zero violations)
        run: ruff check orchestrator/ sdk/ tests/

  dashboard:
    name: Dashboard JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Every dashboard module parses as an ES module
        run: |
          status=0
          for f in $(git ls-files 'dashboard/*.js' 'dashboard/**/*.js'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::does not parse as an ES module"; status=1; }
          done
          exit $status

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r orchestrator/requirements.txt -r requirements-dev.txt
      - run: mypy orchestrator/ sdk/ || echo "::warning::mypy found type errors (non-blocking)"

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: modus
          POSTGRES_USER: modus
          POSTGRES_PASSWORD: modus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MODUS_DATABASE_URL: postgresql+asyncpg://modus:modus@localhost:5432/modus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r orchestrator/requirements.txt
      - name: Apply migrations to an empty database
        run: alembic upgrade heads
      - name: Schema must match the ORM models
        run: python scripts/check_migrations.py
      - name: Migrations must downgrade cleanly
        run: alembic downgrade base

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      MODUS_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      MODUS_AUTH_MODE: stub
      MODUS_ENVIRONMENT: development
      MODUS_METRICS_ENABLED: "false"
      MODUS_MASTER_API_KEY: mds_master_ci_test_key_placeholder_000
      MODUS_SECRET_KEY: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r orchestrator/requirements.txt -r requirements-dev.txt
      - name: Run tests (must exit 0 — zero failures allowed)
        run: >
          pytest tests/ -v --tb=short -x --strict-markers
          --cov=orchestrator --cov=sdk/modus
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=70
      - name: Verify clean exit
        run: echo "All tests passed with exit code 0"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
