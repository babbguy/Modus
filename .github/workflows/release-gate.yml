name: Release gate

# Runs the production image the way users do (real SDK traffic, real database,
# real browser) and fails on stale reads, miscounted usage, broken
# enforcement, server errors, dashboard errors and resource overruns.
# See e2e/README.md.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Release gate (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the browser sweep (pinned Playwright + Chromium)
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the production image
        run: docker build -t modus:gate .
      - name: Run the release gate
        run: python e2e/run_gate.py --db ${{ matrix.db }} --image modus:gate --out e2e/out/${{ matrix.db }}
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-${{ matrix.db }}
          path: e2e/out/${{ matrix.db }}
          retention-days: 14
          if-no-files-found: warn
