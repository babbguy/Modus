name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r orchestrator/requirements.txt
      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SDK_VERSION=$(python -c "import tomllib; print(tomllib.load(open('sdk/pyproject.toml','rb'))['project']['version'])")
          CONFIG_VERSION=$(grep -oP "version:\s*str\s*=\s*\"(\K[^\"]+)" orchestrator/core/config.py || echo "")
          echo "Tag: $TAG_VERSION, SDK: $SDK_VERSION"
          if [ "$TAG_VERSION" != "$SDK_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION sdk=$SDK_VERSION"
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs: validate
    # The repository's default workflow token is read-only; creating a
    # release needs write access to contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py "${GITHUB_REF_NAME}" --images > release-notes.md
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Modus ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false

  publish-sdk:
    runs-on: ubuntu-latest
    needs: release
    env:
      # PyPI publishing is optional: it only runs when a PYPI_TOKEN secret exists.
      HAS_PYPI: ${{ secrets.PYPI_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build SDK package
        run: |
          pip install build
          cd sdk && python -m build
      - name: Publish to PyPI
        if: env.HAS_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/dist/
          password: ${{ secrets.PYPI_TOKEN }}
