name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r orchestrator/requirements.txt
      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SDK_VERSION=$(python -c "import tomllib; print(tomllib.load(open('sdk/pyproject.toml','rb'))['project']['version'])")
          CONFIG_VERSION=$(grep -oP "version:\s*str\s*=\s*\"(\K[^\"]+)" orchestrator/core/config.py || echo "")
          echo "Tag: $TAG_VERSION, SDK: $SDK_VERSION"
          if [ "$TAG_VERSION" != "$SDK_VERSION" ]; then
            echo "::error::Version mismatch: tag=$TAG_VERSION sdk=$SDK_VERSION"
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-sdk:
    runs-on: ubuntu-latest
    needs: release
    env:
      # PyPI publishing is optional: it only runs when a PYPI_TOKEN secret exists.
      HAS_PYPI: ${{ secrets.PYPI_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build SDK package
        run: |
          pip install build
          cd sdk && python -m build
      - name: Publish to PyPI
        if: env.HAS_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist/
          password: ${{ secrets.PYPI_TOKEN }}
