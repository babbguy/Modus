# CLA Assistant Lite (https://github.com/contributor-assistant/github-action).
# Contributors sign CLA.md once, by commenting on a pull request. Signatures are
# stored in signatures/version1/cla.json on the dedicated cla-signatures branch.
#
# Security: this workflow runs on pull_request_target, so it has write access to
# the base repository. It must never check out or run code from the pull
# request; it has no checkout step and none may be added.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # signatures are stored in this repository
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1, pinned to the commit SHA of the release tag
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/babbguy/Modus/blob/develop/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          # The branch must exist and must not be protected.
          branch: 'cla-signatures'
          allowlist: babbguy,dependabot[bot],dependabot,github-actions[bot],github-actions
