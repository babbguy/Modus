version: 2

updates:
  # Python dependencies: orchestrator, conductor and federator. They pin the
  # same versions, so one grouped pull request keeps them in step.
  - package-ecosystem: "pip"
    directories:
      - "/orchestrator"
      - "/conductor"
      - "/federator"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # One pull request per month for all Python dependencies.
    groups:
      python:
        patterns: ["*"]
    labels:
      - "dependencies"
    # Held-back upgrades. These rules only filter version updates: with
    # target-branch set, options in this block do not apply to security
    # updates (GitHub's Dependabot options reference, "target-branch").
    ignore:
      # FastAPI 0.137+ keeps each included router as one node in app.routes
      # and builds its route table lazily, on the event loop, on the first
      # request that reaches it. CI caught the stall (first request to a
      # router blocked the loop for 65 ms, 355 ms under coverage; the
      # off-event-loop hashing test failed), and three tests that walk
      # app.routes would pass while checking nothing. Revisit once the route
      # tables are built at startup and those tests walk the expanded routes.
      - dependency-name: "fastapi"
        versions: [">=0.137"]
      # SQLAlchemy 2.1 requires Python 3.11; Modus supports Python 3.10+
      # (README, CONTRIBUTING, docs/deployment.md). Revisit when the minimum
      # Python is raised to 3.11 (Python 3.10 reaches end of life in
      # October 2026).
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]

  # Base images in the Dockerfiles (Dockerfile, Dockerfile.orchestrator,
  # Dockerfile.conductor; federator/Dockerfile, federator/Dockerfile.slim).
  # They are pinned by digest; Dependabot moves the digest when the tag is
  # rebuilt upstream (security fixes in the base image).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/federator"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ["*"]
    labels:
      - "dependencies"
    ignore:
      # Moving to a newer Python (3.13, 3.14) is a deliberate change, not a
      # routine update; digest updates within 3.12 still arrive.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  # Third-party images in the Compose files (PostgreSQL in
  # docker-compose.yml, Caddy in the federator files), pinned by digest.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/federator"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      docker-compose:
        patterns: ["*"]
    labels:
      - "dependencies"
    ignore:
      # A new PostgreSQL major version needs a dump and restore of existing
      # data, so it is never an automatic update.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # One pull request per month for all GitHub Actions.
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
