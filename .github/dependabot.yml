version: 2

updates:
  # Python dependencies (orchestrator)
  - package-ecosystem: "pip"
    directory: "/orchestrator"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # One pull request per month for all Python dependencies.
    groups:
      python:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "security"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # One pull request per month for all GitHub Actions.
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
