# Modus — Standalone deploy (SQLite, single container)
# No PostgreSQL needed. Dashboard served by the orchestrator.
# Usage: cp .env.example .env && docker compose -f docker-compose.standalone.yml up --build -d
# Dashboard: http://localhost:8080

name: modus

services:
  modus:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    environment:
      - MODUS_DATABASE_URL=sqlite+aiosqlite:///data/modus.db
      - MODUS_PORT=8080
    restart: unless-stopped
    volumes:
      - modus_data:/app/data
      - ./plugins:/app/plugins
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"

volumes:
  modus_data:
