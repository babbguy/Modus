# Alembic configuration for Modus (PostgreSQL deployments only).
#
# SQLite deployments do not use Alembic: init_db() creates tables with
# create_all on startup. PostgreSQL deployments apply these migrations; the
# container entrypoint runs `alembic upgrade heads` before starting the app.
#
# Common commands (MODUS_DATABASE_URL must point at PostgreSQL):
#   alembic upgrade heads
#   alembic current
#   alembic revision --autogenerate -m "description"
#
# After changing orchestrator/db/models.py, generate a migration and check it
# against a scratch database before committing.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Read DATABASE_URL from environment — same as the orchestrator
sqlalchemy.url = %(MODUS_DATABASE_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
